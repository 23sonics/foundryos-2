---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - discord

  - type: dnf
    repos:
      cleanup: true
      nonfree: negativo17
    install:
      packages:
        - libreoffice
        - webkit2gtk4.1
        - libburn
        - cdrskin
        - k3b
        - steam
        - ffmpeg
        - yt-dlp
        - waydroid
        - mediawriter
        - lzip

  # Docker
  - type: dnf
    repos:
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
    install:
      packages:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
  - type: systemd
    system:
      enabled:
        - docker.service

# no need for this package at this time
#  - type: dnf
#    install:
#      packages:
#        - https://github.com/patryk-ku/music-discord-rpc/releases/latest/download/music-discord-rpc.rpm

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system

  - type: signing
